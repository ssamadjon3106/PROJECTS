{% extends 'base.html' %}

{% block title %}{{ app_title }} | Team Architecture{% endblock %}

{% block content %}
<section class="catalog-shell">
    <p class="eyebrow">{{ owner }}</p>
    <h1>{{ app_title }}</h1>
    <p class="lead">{{ purpose }}</p>
    <div class="mini-list">
        {% for module in modules %}
            <div class="mini-item"><span>{{ module }}</span><em>owned</em></div>
        {% endfor %}
    </div>
</section>
{% endblock %}
